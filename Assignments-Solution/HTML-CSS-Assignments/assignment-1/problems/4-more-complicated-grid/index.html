
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        .container {
            width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
        }

        .left {
            background-color: red;
            padding: 20px;
        }

        .left-header {
            text-align: center;
        }

        .right {
            background-color: blue;
            display: flex;
            align-items: center;
            padding: 20px;
        }

        .grid1 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            width: 100%;
            gap: 10px;
        }
        
        .grid1 h2 {
            margin: 0;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left">
            <div class="left-header">
                <h1>Left</h1>
            </div>
            <div>
                <h3>
                text text text text text text text text text text text text text
                </h3>
            </div>
        </div>
        <div class="right">
            <div class="grid1">
                <h2>Col 1</h2>
                <h2>Col 2</h2>
                <h2>Col 3</h2>
                <h2>Col 1</h2>
                <h2>Col 2</h2>
                <h2>Col 3</h2>
                <h2>Col 1</h2>
                <h2>Col 2</h2>
                <h2>Col 3</h2>
            </div>
        </div>
    </div>
</body>

</html>
